<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pinta Pinta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pinta Pinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: una sola pantalla sin scroll de página. Portada = láminas + barra de temas.
   Pintar = botones grandes a los costados de la hoja (abajo si el aparato está vertical). */
:root{
  --sky:#5fc1f6; --sky-soft:#a3defb; --sky-deep:#2f96d8;
  --ink:#17386b; --line:#1b1d2a; --paper:#fff; --cream:#f7e4c6; --wood:#eebd85;
  --sun:#ffc531; --leaf:#5acb4c; --coral:#f0524f; --plum:#a75bf0; --tangerine:#ff9a1f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --btn:clamp(50px,11.5vmin,78px);
  --cur:#e8211c;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:
    radial-gradient(circle at 42% 8%,var(--sky-soft) 0 9vmin,transparent 9.2vmin),
    radial-gradient(circle at 49% 3%,var(--sky-soft) 0 11vmin,transparent 11.2vmin),
    radial-gradient(circle at 34% 92%,var(--sky-soft) 0 8vmin,transparent 8.2vmin),
    radial-gradient(circle at 74% 96%,var(--sky-soft) 0 10vmin,transparent 10.2vmin),
    var(--sky);
  color:var(--ink);font-family:var(--body);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,label:focus-within{outline:4px solid var(--ink);outline-offset:3px}
svg.i{width:58%;height:58%;display:block;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.screen{height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* Botón gordito, se hunde al tocarlo */
.fat{
  width:var(--btn);height:var(--btn);flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--c,var(--sky-deep));border:3px solid #fff;box-shadow:0 5px 0 rgba(23,56,107,.35);
  transition:transform .08s,box-shadow .08s;
}
.fat:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(23,56,107,.35)}
.fat.sq{border-radius:22%}

/* ---------- Portada ---------- */
#home{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
#home[hidden]{display:none}
header{display:flex;align-items:center;gap:12px}
h1{margin:0;flex:1;min-width:0;font:800 clamp(30px,7.5vmin,52px)/1 var(--display);color:#fff;letter-spacing:.5px;
  -webkit-text-stroke:0;text-shadow:0 3px 0 var(--sky-deep),2px 0 0 var(--sky-deep),-2px 0 0 var(--sky-deep)}
h1 b{color:var(--sun);font-weight:800}
.small{--btn:clamp(46px,9.5vmin,62px)}
#lockBtn{position:relative;--c:#7f93ab}
#lockBtn::after{content:"";position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--sun) calc(var(--p,0)*1turn),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 0)}
#hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px);z-index:5;background:var(--ink);color:#fff;font-weight:800;padding:8px 14px;border-radius:12px;font-size:15px}
#grid{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:grid;gap:clamp(10px,2.4vmin,20px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(136px,24vw,250px),1fr));align-content:start;grid-auto-rows:max-content;padding:6px 8px 10px}
.card{display:block;width:100%;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(23,56,107,.25);overflow:hidden;transition:transform .1s}
.card:active{transform:scale(.96)}
.thumb{position:relative;display:block;aspect-ratio:3/2;background:#fff}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.thumb img.l{mix-blend-mode:multiply}
.blank{grid-column:1/-1;background:rgba(255,255,255,.92);border-radius:18px;padding:22px;display:flex;align-items:center;gap:18px;max-width:640px}
.blank p{margin:0;font-weight:800;font-size:17px;line-height:1.4}
#cats{display:flex;gap:clamp(8px,2vmin,16px);overflow-x:auto;overscroll-behavior:contain;touch-action:pan-x;padding:8px 6px 10px;border-top:3px solid rgba(255,255,255,.6);scrollbar-width:none}
#cats::-webkit-scrollbar,#colors::-webkit-scrollbar{display:none}
.cat{--s:clamp(64px,14vmin,96px);flex:none;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);border:4px solid #fff;overflow:hidden;position:relative;box-shadow:0 4px 0 rgba(23,56,107,.25);transition:transform .12s}
.cat img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.cat svg.i{position:absolute;inset:21%}
.cat[aria-pressed="true"]{transform:scale(1.1);box-shadow:0 0 0 5px var(--sun)}

/* ---------- Pintar ---------- */
#paint{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(8px,2vmin,18px);align-items:stretch}
#paint[hidden]{display:none}
#actions{display:flex;flex-direction:column;justify-content:space-around;align-items:center;gap:8px}
#stage{container-type:size;display:grid;place-items:center;min-width:0;min-height:0}
#sheet{position:relative;width:min(100cqw,150cqh);aspect-ratio:3/2;max-width:100%;background:#fff;border-radius:clamp(12px,3vmin,24px);overflow:hidden;
  border:4px solid #2bb7cc;box-shadow:0 6px 0 rgba(23,56,107,.25);touch-action:none}
#sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#lines{pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#sheet.shake{animation:sh .3s}
@keyframes sh{25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
#bench{display:flex;background:var(--cream);border-radius:20px;box-shadow:inset 0 0 0 3px rgba(161,108,56,.25);overflow:hidden}
#colors{display:flex;flex-direction:column;gap:clamp(6px,1.6vmin,12px);padding:10px 9px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.dot{--d:clamp(44px,10vmin,66px);flex:none;width:var(--d);height:var(--d);border-radius:50%;background:var(--c);
  box-shadow:inset 0 0 0 3px rgba(120,80,40,.4),inset -4px -6px 0 rgba(0,0,0,.12);position:relative;transition:transform .1s}
.dot::after{content:"";position:absolute;width:18%;height:14%;top:17%;right:22%;background:rgba(255,255,255,.75);border-radius:50%;transform:rotate(35deg)}
.dot[aria-pressed="true"]{transform:scale(1.06);box-shadow:0 0 0 5px #fff,0 0 0 8px var(--tangerine),inset -4px -6px 0 rgba(0,0,0,.12)}
.dot.rain{background:linear-gradient(135deg,#18a6e8 0 22%,#3ec43a 22% 42%,#ffd400 42% 60%,#ff7a00 60% 78%,#e8211c 78%)}
#tools{display:flex;flex-direction:column;justify-content:space-around;align-items:center;gap:6px;background:var(--wood);padding:8px}
.tool{--d:clamp(46px,11vmin,72px);width:var(--d);height:var(--d);flex:none;border-radius:16px;display:grid;place-items:center;transition:transform .12s}
.tool svg{width:92%;height:92%;display:block}
.tool[aria-pressed="true"]{background:#fff;transform:scale(1.08);box-shadow:0 3px 0 rgba(120,80,40,.4)}

@media (orientation:portrait){
  #paint{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  #actions{flex-direction:row}
  #bench{flex-direction:column;min-width:0}
  #colors{flex-direction:row;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding:12px}
  #tools{flex-direction:row}
}

/* ---------- Panel de papá/mamá ---------- */
.over{position:fixed;inset:0;z-index:20;background:rgba(23,56,107,.55);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.over[hidden]{display:none}
#panelBox{width:min(620px,100%);max-height:100%;overflow-y:auto;background:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;user-select:text;-webkit-user-select:text;touch-action:pan-y;overscroll-behavior:contain}
.phead{display:flex;align-items:center;gap:12px;justify-content:space-between}
h2{margin:0;font:800 26px/1.1 var(--display);text-wrap:balance}
h3{margin:0 0 8px;font:800 18px/1.2 var(--display)}
.note{margin:0;font-size:15px;line-height:1.45;color:#3d5678}
#pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:22px 14px;text-align:center;border:3px dashed var(--sky-deep);border-radius:16px;background:#eaf7fe;font-weight:800;font-size:17px;cursor:pointer}
#pick small{font-weight:600;font-size:14px;color:#3d5678}
#file{position:absolute;opacity:0;width:1px;height:1px}
#editor{display:flex;flex-direction:column;gap:10px}
#editor[hidden]{display:none}
#preview{width:100%;aspect-ratio:3/2;display:block;background:#fff;border:3px solid #cfe6f3;border-radius:12px}
.field{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:15px}
#detail,#musicVol{width:100%;accent-color:var(--sky-deep);height:32px;touch-action:pan-x}
#dname{padding:10px 12px;border:2px solid #b8d4e6;border-radius:10px;background:#fff;font-weight:600;font-size:16px;user-select:text;-webkit-user-select:text;min-width:0;width:100%}
.act{align-self:flex-start;background:var(--leaf);color:#113d0c;font:800 17px var(--display);padding:10px 22px;border-radius:12px;box-shadow:0 4px 0 #3b9e30}
.act.ghost{background:#e4eff7;color:var(--ink);box-shadow:0 4px 0 #bcd4e4}
.act.warn{background:var(--coral);color:#fff;box-shadow:0 4px 0 #b83431}
.act:active{transform:translateY(3px);box-shadow:none}
#msg{margin:0;font-weight:800;font-size:15px;min-height:1.3em}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row .mini{width:72px;aspect-ratio:3/2;flex:none;background:#fff;border:2px solid #cfe6f3;border-radius:8px;object-fit:contain}
.row span{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.row .act{padding:6px 12px;font-size:14px;align-self:center}
.check{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;min-height:32px}
.check input{width:22px;height:22px;accent-color:var(--sky-deep);flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
#viewer{cursor:pointer}
#viewBox{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;max-height:100%}
#viewImg{max-width:100%;max-height:calc(100vh - 110px);border-radius:16px;border:5px solid #fff;background:#fff;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H6M12 5l-7 7 7 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5L4 9l4 4M4 9h10a5.5 5.5 0 0 1 0 11H9"/></symbol>

  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.2-5.6-3.1-5.6 3.1 1.2-6.2L3 9.6l6.3-.8z"/></symbol>
</defs></svg>

<main id="home" class="screen">
  <header>
    <h1>Pinta <b>Pinta</b></h1>
    <button id="soundBtn" class="fat small" style="--c:var(--plum)" aria-label="Sonido"><svg class="i"><use href="#i-sound"/></svg></button>
    <button id="lockBtn" class="fat small" aria-label="Papá o mamá: mantené apretado para abrir"><svg class="i"><use href="#i-lock"/></svg></button>
  </header>
  <div id="hint" hidden>Mantené apretado 2 segundos</div>
  <div id="grid"></div>
  <nav id="cats" aria-label="Temas"></nav>
</main>

<section id="paint" class="screen" hidden>
  <div id="actions">
    <button id="backBtn" class="fat sq" style="--c:#2f96e8" aria-label="Volver a los dibujos"><svg class="i"><use href="#i-back"/></svg></button>
    <button id="clearBtn" class="fat" style="--c:var(--coral)" aria-label="Borrar todo"><svg class="i"><use href="#i-trash"/></svg></button>
    <button id="snapBtn" class="fat" style="--c:var(--leaf)" aria-label="Guardar la obra"><svg class="i"><use href="#i-cam"/></svg></button>
    <button id="undoBtn" class="fat" style="--c:var(--plum)" aria-label="Deshacer"><svg class="i"><use href="#i-undo"/></svg></button>
    <button id="sayBtn" class="fat" style="--c:var(--tangerine)" aria-label="Escuchar el nombre"><svg class="i"><use href="#i-say"/></svg></button>
  </div>
  <div id="stage">
    <div id="sheet">
      <canvas id="layer" width="1200" height="800" aria-label="Hoja para pintar"></canvas>
      <canvas id="lines" width="1200" height="800"></canvas>
      <div id="flash"></div>
    </div>
  </div>
  <div id="bench">
    <div id="colors" role="group" aria-label="Colores"></div>
    <div id="tools" role="group" aria-label="Herramientas"></div>
  </div>
</section>

<div id="panel" class="over" hidden>
  <div id="panelBox" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="phead">
      <h2 id="panelTitle">Para papá o mamá</h2>
      <button id="panelClose" class="act ghost">Cerrar</button>
    </div>
    <section>
      <h3>Subir un dibujo nuevo</h3>
      <label id="pick" for="file">Elegir una imagen
        <small>Foto, captura o dibujo. La app la pasa a líneas para pintar.</small>
      </label>
      <input id="file" type="file" accept="image/*">
    </section>
    <div id="editor" hidden>
      <canvas id="preview" width="1200" height="800"></canvas>
      <label class="field" for="detail">Cantidad de líneas
        <input id="detail" type="range" min="0" max="100" value="55">
      </label>
      <label class="field" for="dname">Nombre
        <input id="dname" type="text" maxlength="40" placeholder="Por ejemplo: Nuestro perro">
      </label>
      <button id="saveDraw" class="act">Agregar a Mis dibujos</button>
    </div>
    <p id="msg" role="status"></p>
    <section>
      <h3>Dibujos subidos</h3>
      <div id="customList" class="rows"></div>
    </section>
    <section>
      <h3>Obras guardadas</h3>
      <div id="obraList" class="rows"></div>
    </section>
    <section>
      <h3>Música y sonidos</h3>
      <div class="rows">
        <label class="check" for="musicOn"><input id="musicOn" type="checkbox"> Música de fondo</label>
        <label class="field" for="musicVol">Volumen de la música
          <input id="musicVol" type="range" min="10" max="100">
        </label>
        <label class="check" for="voiceOn"><input id="voiceOn" type="checkbox"> Decir el nombre del dibujo cada tanto</label>
      </div>
    </section>
    <section class="btnrow">
      <button id="fsBtn" class="act ghost">Pantalla completa</button>
    </section>
    <p class="note">Dibujos: OpenMoji (CC BY-SA 4.0), adaptados. Música: canciones tradicionales tocadas con los instrumentos de FluidR3 GM (CC BY 3.0).</p>
  </div>
</div>

<div id="viewer" class="over" hidden>
  <div id="viewBox">
    <img id="viewImg" alt="Obra guardada">
    <div class="btnrow">
      <button id="viewClose" class="act ghost">Cerrar</button>
      <button id="viewSave" class="act" hidden>Guardar en el aparato</button>
    </div>
  </div>
</div>

const mem={custom:new Map,paint:new Map,obras:new Map};
let idb=null;
const idbReady=new Promise(res=>{try{const r=indexedDB.open('pinta-pinta',1);
  r.onupgradeneeded=()=>{for(const s of Object.keys(mem))r.result.createObjectStore(s)};
  r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}});
const tx=async(store,mode,fn)=>{await idbReady;if(!idb)return null;return new Promise((res,rej)=>{try{const q=fn(idb.transaction(store,mode).objectStore(store));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})};
const kv={
  async get(s,k){try{if(idb||await idbReady,idb)return await tx(s,'readonly',o=>o.get(k))}catch(e){}return mem[s].get(k)},
  async set(s,k,v){mem[s].set(k,v);try{await tx(s,'readwrite',o=>o.put(v,k))}catch(e){}},
  async del(s,k){mem[s].delete(k);try{await tx(s,'readwrite',o=>o.delete(k))}catch(e){}},
  async all(s){try{await idbReady;if(idb)return (await tx(s,'readonly',o=>o.getAll()))||[]}catch(e){}return [...mem[s].values()]},
  async keys(s){try{await idbReady;if(idb)return (await tx(s,'readonly',o=>o.getAllKeys()))||[]}catch(e){}return [...mem[s].keys()]},
};
const useCap=async n=>{try{return window.claude?.use?await window.claude.use(n):null}catch(e){return null}};

/* Sincroniza los dibujos subidos entre aparatos cuando hay cuenta disponible */
async function syncCloud(){
  const db=await useCap('db');if(!db)return;
  try{
    const snap=await db.collection('dibujos').get();
    const remote=new Map(snap.docs.map(x=>[x.id,x.data()]));
    const local=await kv.all('custom');let changed=false;
    for(const it of local){if(it.assetId&&!remote.has(it.id)){await kv.del('custom',it.id);await kv.del('paint',it.id);changed=true}}
    for(const [id,r] of remote){
      if(local.some(l=>l.id===id)||!r.assetId)continue;
      const res=await fetch('/_blob/'+r.assetId);if(!res.ok)continue;
      await kv.set('custom',id,{id,name:r.name||'Dibujo',createdAt:r.createdAt||0,assetId:r.assetId,blob:await res.blob()});changed=true;
    }
    if(changed){await refreshHome();renderLists()}
  }catch(e){}
}

let audio=null,master,musicBus,fxBus,noiseBuf;
function ac(){
  if(audio)return audio;
  try{audio=new (window.AudioContext||window.webkitAudioContext)();
    master=audio.createGain();master.gain.value=prefs.sound?1:0;master.connect(audio.destination);
    musicBus=audio.createGain();musicBus.gain.value=musicLevel();musicBus.connect(master);
    fxBus=audio.createGain();fxBus.connect(master);
    noiseBuf=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){audio=null}
  return audio}
const musicLevel=()=>prefs.music?prefs.vol/100*1.45:0;
function duck(on){if(!audio)return;const t=audio.currentTime;musicBus.gain.cancelScheduledValues(t);musicBus.gain.setTargetAtTime(on?musicLevel()*.3:musicLevel(),t,.15)}
/* Música grabada con instrumentos reales. Se baja al abrir y suena cuando el navegador lo permite */
const musicBytes=fetch('musica.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).catch(()=>null);
let musicState=0;
async function startMusic(){
  if(musicState||!ac())return;musicState=1;
  try{const bytes=await musicBytes;if(!bytes){musicState=0;return}
    const buf=await audio.decodeAudioData(bytes.slice(0));
    const src=audio.createBufferSource();src.buffer=buf;src.loop=true;src.connect(musicBus);src.start();musicState=2;
  }catch(e){musicState=0}}

function speak(text,done){
  let ended=false;const end=()=>{if(ended)return;ended=true;clearTimeout(g);done&&done()};
  const g=setTimeout(end,3500);
  try{if(!window.speechSynthesis||!esVoice&&!speechSynthesis.getVoices().length){end();return}
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=esVoice?.lang||'es-AR';if(esVoice)u.voice=esVoice;u.rate=.82;u.pitch=1.25;u.onend=end;u.onerror=end;speechSynthesis.speak(u)}catch(e){end()}}
let sayToken=0,announceT=0;

/* ======= Hoja de pintar ======= */
const layer=$('layer'),lines=$('lines'),ctx=layer.getContext('2d',{willReadFrequently:true}),lctx=lines.getContext('2d',{willReadFrequently:true});
let cur=null,wall=new Uint8Array(W*H),undoStack=[],tool='brush',color='#e8211c',hue=0,saveT=0;

async function buildLines(src){
  lctx.clearRect(0,0,W,H);
  const u=src.d?artUrl(src.d.id):URL.createObjectURL(src.custom.blob),img=new Image;img.src=u;await img.decode();lctx.drawImage(img,0,0,W,H);if(!src.d)URL.revokeObjectURL(u);
  const a=lctx.getImageData(0,0,W,H).data;for(let i=0;i<W*H;i++)wall[i]=a[i*4+3]>110?1:0;
  /* En imágenes subidas cierra huecos chicos para que las partes queden separadas */
  if(src.custom)for(let pass=0;pass<3;pass++){const n=wall.slice();for(let i=W+1;i<W*H-W-1;i++)if(n[i]&&!wall[i])0;else if(!n[i]&&(n[i-1]||n[i+1]||n[i-W]||n[i+W]))wall[i]=1}
}
async function openPaint(src){
  cur=src;undoStack=[];ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
  $('home').hidden=true;$('paint').hidden=false;
  await buildLines(src);
  const saved=await kv.get('paint',curId());
  if(saved){try{const u=URL.createObjectURL(saved),i=new Image;i.src=u;await i.decode();ctx.drawImage(i,0,0,W,H);URL.revokeObjectURL(u)}catch(e){}}
  try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}
  scheduleAnnounce(700);
}
const curId=()=>cur.d?cur.d.key:cur.custom.id;
function pushUndo(){const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(layer,0,0);undoStack.push(c);if(undoStack.length>12)undoStack.shift()}
function persist(){clearTimeout(saveT);const id=curId();saveT=setTimeout(()=>layer.toBlob(b=>b&&kv.set('paint',id,b),'image/png'),500)}
async function flush(){clearTimeout(saveT);const id=curId();await new Promise(r=>layer.toBlob(async b=>{if(b)await kv.set('paint',id,b);r()},'image/png'))}
const pos=e=>{const r=layer.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function sectionAt(px,py){
  let sx=Math.round(px),sy=Math.round(py);
  const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
  if(!inb(sx,sy))return null;
  if(wall[sy*W+sx]){let f=false;for(let r=2;r<=30&&!f;r+=2)for(let a=0;a<16;a++){const x=Math.round(sx+Math.cos(a*Math.PI/8)*r),y=Math.round(sy+Math.sin(a*Math.PI/8)*r);if(inb(x,y)&&!wall[y*W+x]){sx=x;sy=y;f=true;break}}if(!f)return null}
  const reg=new Uint8Array(W*H),st=[sy*W+sx];let minY=H,maxY=0;reg[st[0]]=1;
  while(st.length){const i=st.pop(),x=i%W,y=(i/W)|0;if(y<minY)minY=y;if(y>maxY)maxY=y;
    if(x>0&&!reg[i-1]&&!wall[i-1]){reg[i-1]=1;st.push(i-1)}if(x<W-1&&!reg[i+1]&&!wall[i+1]){reg[i+1]=1;st.push(i+1)}
    if(y>0&&!reg[i-W]&&!wall[i-W]){reg[i-W]=1;st.push(i-W)}if(y<H-1&&!reg[i+W]&&!wall[i+W]){reg[i+W]=1;st.push(i+W)}}
  /* El color entra un poco debajo de la línea para que no queden bordes blancos */
  for(let pass=2;pass<=5;pass++)for(let i=W+1;i<W*H-W-1;i++)if(!reg[i]&&wall[i]&&(reg[i-1]===pass-1||reg[i+1]===pass-1||reg[i-W]===pass-1||reg[i+W]===pass-1))reg[i]=pass;
  return{reg,minY,maxY,sx,sy};
}
/* Máscara de la sección tocada: el pincel y el lápiz no se salen de ahí */
function maskOf(sec){const m=new ImageData(W,H),d=m.data;for(let i=0;i<W*H;i++)if(sec.reg[i])d[i*4+3]=255;const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').putImageData(m,0,0);return c}
const strokeC=document.createElement('canvas');strokeC.width=W;strokeC.height=H;const sctx=strokeC.getContext('2d');
function floodFill(px,py){
  const sec=sectionAt(px,py);if(!sec)return;
  const {reg,minY,maxY,sx,sy}=sec;
  const out=new ImageData(W,H),d=out.data,span=Math.max(1,maxY-minY+1);
  const solid=color==='rain'?null:hex(color),bands=RAIN.map(hex);
  for(let i=0;i<W*H;i++)if(reg[i]){const y=(i/W)|0,c=solid||bands[Math.min(5,((y-minY)/span*6)|0)],k=i*4;d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255}
  const t=document.createElement('canvas');t.width=W;t.height=H;t.getContext('2d').putImageData(out,0,0);
  pushUndo();
  const finish=()=>{ctx.globalCompositeOperation='source-over';ctx.drawImage(t,0,0);persist()};
  if(reduce)return finish();
  const t0=performance.now(),maxR=Math.hypot(W,H);
  (function step(n){const p=Math.min(1,(n-t0)/320);ctx.save();ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.arc(sx,sy,maxR*p*p+20,0,7);ctx.clip();ctx.drawImage(t,0,0);ctx.restore();p<1?requestAnimationFrame(step):persist()})(t0);
}
function sticker(x,y){
  const k=Math.floor(Math.random()*4),r=54+Math.random()*16,rot=(Math.random()-.5)*.9,col=color==='rain'?RAIN[Math.random()*6|0]:color;
  ctx.save();ctx.globalCompositeOperation='source-over';ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  if(k===0){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.5:r;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q)}ctx.closePath()}
  else if(k===1){ctx.moveTo(0,r*.9);ctx.bezierCurveTo(-r*1.5,-r*.1,-r*.7,-r*1.1,0,-r*.35);ctx.bezierCurveTo(r*.7,-r*1.1,r*1.5,-r*.1,0,r*.9)}
  else if(k===2){for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.moveTo(Math.cos(a)*r*.55+r*.42,Math.sin(a)*r*.55);ctx.arc(Math.cos(a)*r*.55,Math.sin(a)*r*.55,r*.42,0,7)}}
  else ctx.arc(0,0,r*.8,0,7);
  ctx.lineWidth=12;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.stroke();ctx.fillStyle=col;ctx.fill();
  if(k===2){ctx.beginPath();ctx.arc(0,0,r*.3,0,7);ctx.fillStyle='#ffd400';ctx.fill()}
  ctx.restore();
}
const active=new Map;
function seg(a,b,mask){
  const g=tool==='erase',w=g?76:tool==='pencil'?16:46;
  const c=mask?sctx:ctx;
  if(mask)sctx.clearRect(0,0,W,H);
  c.globalCompositeOperation=g?'destination-out':'source-over';c.lineCap='round';c.lineJoin='round';
  c.lineWidth=w;
  if(color==='rain'&&!g){hue=(hue+Math.hypot(b.x-a.x,b.y-a.y)*.35)%360;c.strokeStyle=`hsl(${hue} 92% 54%)`}else c.strokeStyle=g?'#000':color;
  c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x+.01,b.y);c.stroke();c.globalCompositeOperation='source-over';
  if(mask){sctx.globalCompositeOperation='destination-in';sctx.drawImage(mask,0,0);sctx.globalCompositeOperation='source-over';ctx.drawImage(strokeC,0,0)}
}
layer.addEventListener('pointerdown',e=>{
  e.preventDefault();layer.setPointerCapture?.(e.pointerId);const p=pos(e);
  if(tool==='fill')return floodFill(p.x,p.y);
  if(!active.size)pushUndo();
  if(tool==='sticker'){sticker(p.x,p.y);active.set(e.pointerId,{...p,far:p});return}
  const sec=tool==='erase'?null:sectionAt(p.x,p.y),mask=sec?maskOf(sec):null;
  active.set(e.pointerId,{...p,mask});seg(p,p,mask);

layer.addEventListener('pointermove',e=>{
  const a=active.get(e.pointerId);if(!a)return;const p=pos(e);
  if(tool==='sticker'){if(Math.hypot(p.x-a.far.x,p.y-a.far.y)>130){sticker(p.x,p.y);a.far=p}return}
  seg(a,p,a.mask);active.set(e.pointerId,{...p,mask:a.mask})});

(()=>{const b=$('lockBtn');let raf=0,t0=0,hintT=0;

  b.addEventListener('pointerdown',e=>{e.preventDefault();t0=performance.now();

/* ======= Panel: subir y convertir imágenes en líneas ======= */
let srcImg=null;
function openPanel(){$('musicOn').checked=prefs.music;$('voiceOn').checked=prefs.voice;$('musicVol').value=prefs.vol;$('hint').hidden=true;$('panel').hidden=false;$('msg').textContent='';renderLists()}

const pv=$('preview'),pctx=pv.getContext('2d',{willReadFrequently:true});
function lineArt(img,detail){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,W,H);const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,s=Math.min(W/iw,H/ih),dw=iw*s,dh=ih*s;
  x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  const px=x.getImageData(0,0,W,H),d=px.data,g=new Float32Array(W*H),I=new Float64Array((W+1)*(H+1));
  for(let i=0;i<W*H;i++)g[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
  for(let y=0;y<H;y++){let row=0;for(let x2=0;x2<W;x2++){row+=g[y*W+x2];I[(y+1)*(W+1)+x2+1]=I[y*(W+1)+x2+1]+row}}
  const R0=14,K=40-detail*.34,m=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const a=Math.max(0,xx-R0),b=Math.max(0,y-R0),e=Math.min(W,xx+R0+1),f=Math.min(H,y+R0+1),n=(e-a)*(f-b),mean=(I[f*(W+1)+e]-I[b*(W+1)+e]-I[f*(W+1)+a]+I[b*(W+1)+a])/n;if(g[y*W+xx]<mean-K)m[y*W+xx]=1}
  /* Saca puntitos sueltos */
  const seen=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++){if(!m[i]||seen[i])continue;const q=[i];seen[i]=1;for(let h=0;h<q.length;h++){const p=q[h],px2=p%W;for(const n of [px2>0?p-1:-1,px2<W-1?p+1:-1,p-W,p+W])if(n>=0&&n<W*H&&m[n]&&!seen[n]){seen[n]=1;q.push(n)}}if(q.length<36)q.forEach(p=>m[p]=0)}
  /* Engrosa un poco la línea para que el relleno no se escape */
  const out=x.createImageData(W,H);
  for(let i=W+1;i<W*H-W-1;i++)if(m[i]||m[i-1]||m[i+1]||m[i-W]||m[i+W]){const k=i*4;out.data[k]=27;out.data[k+1]=29;out.data[k+2]=42;out.data[k+3]=255}
  x.clearRect(0,0,W,H);x.putImageData(out,0,0);return c}
let artCanvas=null;
function drawPreview(){if(!srcImg)return;artCanvas=lineArt(srcImg,+$('detail').value);pctx.fillStyle='#fff';pctx.fillRect(0,0,W,H);pctx.drawImage(artCanvas,0,0)}
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;$('msg').textContent='';
  try{const u=URL.createObjectURL(f),i=new Image;i.src=u;await i.decode();srcImg=i;$('editor').hidden=false;$('dname').value=f.name.replace(/\.[^.]+$/,'').slice(0,40);drawPreview()}
  catch(err){$('msg').textContent='No pude abrir esa imagen. Probá con un JPG o PNG.'}
  e.target.value=''};
let rz=0;$('detail').oninput=()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(drawPreview)};
$('saveDraw').onclick=async()=>{
  if(!artCanvas)return;const name=$('dname').value.trim()||'Mi dibujo',id='c'+Date.now();
  const blob=await new Promise(r=>artCanvas.toBlob(r,'image/png'));
  await kv.set('custom',id,{id,name,createdAt:Date.now(),blob});
  $('editor').hidden=true;srcImg=null;artCanvas=null;curCat='mis';renderCats();renderLists();
  $('msg').textContent=`Listo: "${name}" está en Mis dibujos.`;
  const [assets,db]=await Promise.all([useCap('assets'),useCap('db')]);
  if(assets&&db){try{const r=await assets.upload(blob,{type:'image/png'});await db.collection('dibujos').doc(id).set({name,assetId:r.id,createdAt:Date.now()});
    const it=await kv.get('custom',id);if(it)await kv.set('custom',id,{...it,assetId:r.id});$('msg').textContent=`Listo: "${name}" está en Mis dibujos, en todos tus aparatos.`}
    catch(e){$('msg').textContent=`Listo: "${name}" quedó guardado en este aparato. No se pudo copiar a los otros.`}}
};
function rowOf(label,blob,onDel){const r=document.createElement('div');r.className='row';const i=new Image;i.className='mini';i.alt='';i.src=URL.createObjectURL(blob);const s=document.createElement('span');s.textContent=label;
  const b=document.createElement('button');b.className='act ghost';b.textContent='Borrar';let armed=false;
  b.onclick=()=>{if(!armed){armed=true;b.textContent='¿Seguro?';b.className='act warn';return}onDel()};r.append(i,s,b);return r}
async function renderLists(){
  const cl=(await kv.all('custom')).sort((a,b)=>b.createdAt-a.createdAt),ol=(await kv.all('obras')).sort((a,b)=>b.createdAt-a.createdAt);
  const a=$('customList'),b=$('obraList');a.textContent='';b.textContent='';
  if(!cl.length)a.innerHTML='<p class="note">Todavía no subiste ninguno.</p>';
  cl.forEach(c=>a.append(rowOf(c.name,c.blob,async()=>{await kv.del('custom',c.id);await kv.del('paint',c.id);renderLists();
    if(c.assetId){const [as,db]=await Promise.all([useCap('assets'),useCap('db')]);try{await db?.collection('dibujos').doc(c.id).delete();await as?.delete(c.assetId)}catch(e){}}})));
  if(!ol.length)b.innerHTML='<p class="note">Se guardan con el botón de la cámara.</p>';
  ol.forEach((o,n)=>b.append(rowOf('Obra '+(ol.length-n),o.blob,async()=>{await kv.del('obras',o.id);renderLists()})));
}
